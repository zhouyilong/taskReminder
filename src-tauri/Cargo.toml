[package]
name = "task_reminder_app"
version = "2.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
# 与 tauri-plugin-updater 共用 reqwest 0.13 + rustls（ring），见 src/http.rs。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.21"
fs2 = "0.4"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2.0"
tokio = { version = "1", features = ["time"] }
cron = "0.17"
aes-gcm = "0.10"
argon2 = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
# WebDAV 密码与同步密码存 Windows 凭据管理器（其他平台仍存本地数据库）。
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.52", features = ["UI_ViewManagement", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
# 开发时 `tauri dev` 会关掉 default features，便签等额外窗口才会走 Vite。
# 生产构建保留 custom-protocol，从打包后的前端资源加载。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 同步加密的 Argon2 在未优化的开发构建中很慢（每次同步数秒），单独开启优化。
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
