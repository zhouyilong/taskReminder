<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#5a4ee8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#5b4fe6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="48" y="48" width="928" height="928" rx="216"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="520" fill="url(#gloss)" clip-path="url(#tile)"/>

  <g filter="url(#shadow)">
    <!-- bell -->
    <circle cx="512" cy="248" r="40" fill="url(#bell)"/>
    <path fill="url(#bell)" d="M512 264
      C388 264 300 356 300 482
      V588
      C300 622 282 648 256 670
      C232 690 244 728 276 728
      H748
      C780 728 792 690 768 670
      C742 648 724 622 724 588
      V482
      C724 356 636 264 512 264 Z"/>
    <path fill="url(#bell)" d="M436 764 A76 76 0 0 0 588 764 Z"/>
  </g>

  <!-- check -->
  <path d="M416 500 L486 570 L612 444" fill="none" stroke="url(#check)"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- reminder badge -->
  <circle cx="736" cy="300" r="82" fill="#ffb020" stroke="#ffffff" stroke-width="28"/>
</svg>
