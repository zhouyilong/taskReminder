[package]
name = "task_reminder_app"
version = "1.5.7"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
base64 = "0.21"
fs2 = "0.4"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2.0"
tokio = { version = "1", features = ["time"] }
cron = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows = { version = "0.52", features = ["UI_ViewManagement", "Win32_Graphics_Gdi"] }

[features]
# 开发时 `tauri dev` 会关掉 default features，便签等额外窗口才会走 Vite。
# 生产构建保留 custom-protocol，从打包后的前端资源加载。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
